# Builds the appliance image the same way `nix/Makefile` does locally, minus the
# colima detour: the runners are real Linux, so Nix runs directly.
#
# Two jobs because two architectures are involved. The Flutter bundle needs the
# Dart AOT snapshotter, which is published as an x86_64 binary only -- it
# cross-compiles for arm64 fine, it just cannot itself run on arm. The image
# needs an aarch64 host so cache.nixos.org serves binaries instead of nixpkgs
# being built from source.
#
# The Pi kernel and firmware come prebuilt from nixos-raspberrypi's cache, so
# the only thing compiled here is flutter-pi.

name: image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bundle:
    name: Flutter bundle (arm64 target, x86_64 host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Not a preference: flutterpi_tool compiles against flutter_tools
          # internals and does not build against anything newer. Keep this in
          # step with mise.toml.
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install flutterpi_tool
        run: |
          dart pub global activate flutterpi_tool
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build the bundle
        run: ./nix/scripts/build-bundle.sh

      - name: Collect it
        run: |
          bundle="$(cat build/flutter-pi/.bundle-path)"
          mkdir -p out
          cp -R "$bundle" out/bundle
          # The prebuilt embedder that ships with the bundle is replaced by the
          # one from pkgs/flutter-pi.nix, linked against the image's libraries.
          rm -f out/bundle/flutter-pi out/bundle/.last_build_id

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: out/bundle
          retention-days: 7

  image:
    name: SD image (aarch64)
    needs: bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      # Only to attach the image to a release; everything else here reads.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: nix/bundle

      - name: Stage the songbook
        # A flake cannot reference paths outside its root, so the pieces are
        # copied in beside it -- the same thing `make bundle` does.
        run: cp -R content nix/content

      - uses: DeterminateSystems/nix-installer-action@v22

      # The kernel comes from nixos-raspberrypi's cache; this is for our own
      # pieces -- flutter-pi and the image itself -- so a rerun that only moved
      # the songbook does not rebuild them.
      #
      # Needs a repository variable CACHIX_CACHE (the cache name) and a secret
      # CACHIX_AUTH_TOKEN. A fork or a PR from one has neither; the step is
      # skipped there rather than failing the run.
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nixos-raspberrypi

      - name: Build
        working-directory: nix
        # `path:` rather than `.`: the flake sits inside a git repository, and a
        # git flake only sees tracked files -- bundle/ and content/ are staged
        # here and deliberately gitignored, so Nix would not find them and the
        # error names systemd units rather than the missing directory. Locally
        # this does not come up because the Makefile mounts nix/ into the
        # container without .git, leaving no repository to filter against.
        run: |
          nix build "path:$PWD#sdImageRaw" \
            --print-build-logs \
            --extra-substituters https://nixos-raspberrypi.cachix.org \
            --extra-trusted-public-keys nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= \
            --out-link result

          # cachix-action pushes what the build produced when it is configured.

      - name: Compress
        working-directory: nix
        run: |
          img="$(find -L result -name '*.img' | head -1)"
          [ -n "$img" ] || { echo "no .img under result/"; ls -R result; exit 1; }
          mkdir -p ../out
          name="pesmarica-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.img"
          # -T0 to use the whole runner; the image is mostly zeroes and packs well.
          xz -9 -T0 -c "$img" > "../out/$name.xz"
          ls -lh "../out/$name.xz"
          sha256sum "../out/$name.xz" > "../out/$name.xz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: sd-image
          path: out/*
          # Already xz; the artifact zip would only add a layer of nothing.
          compression-level: 0
          retention-days: 14

      # A run artifact expires and needs a GitHub login to fetch. Someone
      # flashing a card months from now wants neither, so a published release
      # gets the image attached to it.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
