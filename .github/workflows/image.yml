# Builds the appliance image the same way `nix/Makefile` does locally, minus the
# colima detour: the runners are real Linux, so Nix runs directly.
#
# Two jobs because two architectures are involved. The Flutter bundle needs the
# Dart AOT snapshotter, which is published as an x86_64 binary only -- it
# cross-compiles for arm64 fine, it just cannot itself run on arm. The image
# needs an aarch64 host so cache.nixos.org serves binaries instead of nixpkgs
# being built from source.
#
# The Pi kernel and firmware come prebuilt from nixos-raspberrypi's cache, so
# the only thing compiled here is flutter-pi.

name: image

# Not `push: tags`, though a tag is what makes a release: that fires this a
# second time on the same commit, and the second run cannot attach anything --
# the upload step is gated on the release event. Two from-source mesa builds
# for one release.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bundle:
    name: Flutter bundle (arm64 target, x86_64 host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Not a preference: flutterpi_tool compiles against flutter_tools
          # internals and does not build against anything newer. Keep this in
          # step with mise.toml.
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install flutterpi_tool
        run: |
          dart pub global activate flutterpi_tool
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build the bundle
        run: ./nix/scripts/build-bundle.sh

      - name: Collect it
        run: |
          bundle="$(cat build/flutter-pi/.bundle-path)"
          mkdir -p out
          cp -R "$bundle" out/bundle
          # The prebuilt embedder that ships with the bundle is replaced by the
          # one from pkgs/flutter-pi.nix, linked against the image's libraries.
          rm -f out/bundle/flutter-pi out/bundle/.last_build_id

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: out/bundle
          retention-days: 7

  image:
    name: SD image (aarch64)
    needs: bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      # Only to attach the image to a release; everything else here reads.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: nix/bundle

      - name: Stage the songbook
        # A flake cannot reference paths outside its root, so the pieces are
        # copied in beside it -- the same thing `make bundle` does.
        run: cp -R content nix/content

      # What the card will say it is running. The updater on the box compares a
      # release tag against this, so a freshly flashed card that is already
      # current does not spend half a gigabyte finding that out. A build with no
      # tag to name says "unknown", and then the first release counts as newer.
      - name: Stamp the version
        # Through the environment rather than interpolated into the script: a
        # tag is text somebody chose, and it ends up in a shell either way.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=unknown
          [ "$GITHUB_EVENT_NAME" != release ] || version="$TAG"
          printf '%s\n' "$version" > nix/version

      - uses: DeterminateSystems/nix-installer-action@v22

      # The kernel comes from nixos-raspberrypi's cache; this is for our own
      # pieces -- flutter-pi and the image itself -- so a rerun that only moved
      # the songbook does not rebuild them.
      #
      # Needs a repository variable CACHIX_CACHE (the cache name) and a secret
      # CACHIX_AUTH_TOKEN. A fork or a PR from one has neither; the step is
      # skipped there rather than failing the run.
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nixos-raspberrypi

      - name: Build
        working-directory: nix
        # `path:` rather than `.`: the flake sits inside a git repository, and a
        # git flake only sees tracked files -- bundle/ and content/ are staged
        # here and deliberately gitignored, so Nix would not find them and the
        # error names systemd units rather than the missing directory. Locally
        # this does not come up because the Makefile mounts nix/ into the
        # container without .git, leaving no repository to filter against.
        run: |
          nix build "path:$PWD#sdImageRaw" \
            --print-build-logs \
            --extra-substituters https://nixos-raspberrypi.cachix.org \
            --extra-trusted-public-keys nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= \
            --out-link result

          # The boot partition on its own, for tool/deploy_system.sh RELEASE=...
          # and for the box's own updater. One payload, not one per slot: a
          # system no longer knows which slot it lives in, so the same tree
          # lands in whichever one the box is not running. It is already built
          # as part of the image, so this is a link and nothing else.
          nix build "path:$PWD#firmware" --out-link fw

          # cachix-action pushes what the build produced when it is configured.

      # The one check that cannot run on a laptop: it needs a built initrd, and
      # building one needs this runner. v13 shipped an initrd whose own service
      # called a binary that was not in it -- the box stopped in the initrd with
      # a few unit lines on screen, and nothing before this point had any way to
      # notice.
      - name: Initrd dependencies
        working-directory: nix
        run: |
          command -v cpio >/dev/null || sudo apt-get install -y -qq cpio
          ../tool/check_initrd_deps.sh fw/nixos/default/initrd

      # Where the image's weight actually is. The toplevel is already built as
      # a dependency of the image, so this is seconds, and it is the only way
      # to tell which of mesa, the kernel's modules and the rest of the closure
      # is worth attacking -- the compressed image is ~600 MiB of closure and
      # ~1.5 GiB of zeroes, so nothing but the closure moves the number.
      - name: Closure
        working-directory: nix
        # pipefail because the interesting command is not the last one in the
        # pipeline: without it a broken `nix path-info` exits 1, numfmt exits 0,
        # and the step passes having printed nothing. `head` goes last for the
        # same reason -- closing the pipe early would SIGPIPE sort and fail the
        # step for no reason.
        run: |
          set -euo pipefail
          nix build "path:$PWD#nixosConfigurations.pesmarica.config.system.build.toplevel" \
            --out-link sys
          echo "closure: $(nix path-info -Sh ./sys | awk '{print $2}')"
          nix path-info -rS ./sys | sort -k2 -nr | numfmt --to=iec --field=2 > closure.txt
          head -25 closure.txt

      # The image is ~2 GiB, of which ~600 MiB is the closure's squashfs and the
      # rest is zeroes. The zeroes are the whole job, and they collapse at any
      # level -- the squashfs is already zstd, so turning the dial up only
      # grinds at data that will not give. Measured on one build: xz -9 took
      # 2m43s for 631 MiB, zstd seconds for 643 MiB. Two percent.
      #
      # So a release gets xz, because that file is public and every tool can
      # open it, but at -1: the zeroes go either way and nobody should wait
      # minutes for the rest. Everything else gets zstd, which is what
      # nix/Makefile's `make flash` already expects to unpack.
      - name: Compress
        working-directory: nix
        env:
          RELEASE: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          img="$(find -L result -name '*.img' | head -1)"
          [ -n "$img" ] || { echo "no .img under result/"; ls -R result; exit 1; }
          mkdir -p ../out
          name="pesmarica-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.img"
          if [ "$RELEASE" = true ]; then
            out="$name.xz"; xz -1 -T0 -c "$img" > "../out/$out"
          else
            out="$name.zst"; zstd -T0 -12 -c "$img" > "../out/$out"
          fi
          tar -C fw/nixos -cf - default | zstd -T0 -12 > "../out/pesmarica-system-${GITHUB_SHA::7}.tar.zst"
          cd ../out && ls -lh && for f in "$out" pesmarica-system-*.tar.zst; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v7
        with:
          name: sd-image
          path: out/*
          # Already compressed; the artifact zip would only add a layer of nothing.
          compression-level: 0
          retention-days: 14

      # A run artifact expires and needs a GitHub login to fetch. Someone
      # flashing a card months from now wants neither, so a published release
      # gets the image attached to it.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
