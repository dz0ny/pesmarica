# Seed the data partition from the image on first boot; never overwrite pages
# the user created through the web UI afterwards.
C /var/lib/pesmarica - - - - /usr/share/pesmarica/content

# The access point config lives on the data partition so the web interface can
# change it and so it survives a reflash of the root filesystem.
C /var/lib/pesmarica/hostapd.conf 0600 root root - /usr/share/pesmarica/hostapd.conf
