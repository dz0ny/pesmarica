# DNS only — systemd-networkd hands out the leases.
port=53
no-resolv
no-hosts
bind-interfaces
interface=wlan0
listen-address=192.168.4.1

# Every name resolves to the box. There is no uplink to forward to, and it is
# what makes a phone pop the captive-portal sheet open on the songbook instead
# of sitting on "no internet".
address=/#/192.168.4.1
