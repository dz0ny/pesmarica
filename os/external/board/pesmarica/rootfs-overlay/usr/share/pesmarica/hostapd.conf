# Default access point. The web interface rewrites the copy on the data
# partition (/var/lib/pesmarica/hostapd.conf); this one is the fallback that
# gets restored if that copy is missing or unusable, so a bad SSID typed into
# a phone can never lock you out of the box.
#
# Change the passphrase before this leaves your desk.

interface=wlan0
driver=nl80211
country_code=SI
ieee80211d=1

ssid=Pesmarica
hw_mode=g
channel=6
# 802.11n: the Zero 2 W radio is 2.4 GHz only. Enough for a text editor.
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=pesmarica

# Clients have no reason to talk to each other, only to the box.
ap_isolate=1
macaddr_acl=0
ignore_broadcast_ssid=0
