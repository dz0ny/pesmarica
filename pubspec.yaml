name: pesmarica
description: "Digital signage songbook — markdown pages on a screen, driven by a remote or keypad."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  yaml: ^3.1.4
  path: ^1.9.0
  watcher: ^1.2.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  crypto: ^3.0.6
  flutterpi_gstreamer_video_player: ^0.2.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    # The remote sets its page numbers in the same face the wall does, so the
    # web interface serves this one straight out of the bundle.
    - assets/fonts/AtkinsonHyperlegible-Regular.ttf

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
