<!doctype html>
<html lang="sl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1a15">
<title>Pesmarica — urejanje</title>
<link rel="icon" href="/static/favicon.svg">
<script>
  // Before the stylesheet paints, or the page flashes the wrong skin.
  var saved = null;
  try { saved = localStorage.getItem('pesmarica-skin'); } catch (e) { /* private mode */ }
  document.documentElement.dataset.skin =
    saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/manage.js"></script>

<div id="app"></div>
